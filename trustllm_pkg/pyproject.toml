[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "trustllm"
version = "0.4.0"
description = "Tools for evaluating the trustworthiness of large language models"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "Yue Huang & Siyuan Wu & Haoran Wang", email = "trustllm.benchmark@gmail.com"}]
dependencies = ["requests>=2.31,<3"]

[project.urls]
Homepage = "https://trustllmbenchmark.github.io/TrustLLM-Website/"
Repository = "https://github.com/HowieHwong/TrustLLM"
Documentation = "https://howiehwong.github.io/TrustLLM/"
Issues = "https://github.com/HowieHwong/TrustLLM/issues"

[project.scripts]
trustllm = "trustllm.cli:main"

[project.optional-dependencies]
# API generation uses requests from the base install; no provider SDK or torch needed.
local = ["torch>=2.2,<3", "transformers>=4.45,<5", "accelerate>=0.34,<2", "sentencepiece>=0.2,<1"]
eval = ["torch>=2.2,<3", "transformers>=4.45,<5", "numpy>=1.23,<3", "scipy>=1.9,<2", "pandas>=1.5,<3", "scikit-learn>=1.2,<2", "openai>=1.30,<3", "tqdm>=4.66,<5", "tenacity>=8,<10", "google-api-python-client>=2,<3"]
benchmark = ["trustllm[local,eval]"]
# Kept only for the archived provider-specific generation engine.
legacy = [
    "transformers",
    "huggingface_hub",
    "peft",
    "numpy>=1.18.1",
    "scipy",
    "pandas>=1.0.3",
    "scikit-learn",
    "openai>=1.0.0",
    "tqdm",
    "tenacity",
    "datasets",
    "fschat[model_worker]",
    "python-dotenv",
    "urllib3",
    "anthropic",
    "google.generativeai==0.5.4",
    "google-api-python-client",
    "google.ai.generativelanguage",
    "replicate",
    "zhipuai>=2.0.1"
]
dev = ["pytest>=8,<9", "ruff>=0.9,<1", "build>=1.2,<2", "twine>=6,<7"]
docs = ["mkdocs>=1.6,<2", "mkdocs-material>=9.5,<10"]

[tool.setuptools.packages.find]
where = ["."]
include = ["trustllm*"]

[tool.setuptools.package-data]
trustllm = ["prompt/*.json"]
