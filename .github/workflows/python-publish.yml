name: Publish Python package

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag (for example v0.4.0)
        required: true
        type: string
      publish:
        description: Upload to PyPI after validation (leave off for a build check)
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: pypi-${{ github.event.release.tag_name || inputs.tag }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ github.event.release.tag_name || inputs.tag }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify the release tag matches package metadata
        id: version
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: |
          python - <<'PY'
          import os
          import tomllib
          from pathlib import Path

          project = tomllib.loads(Path('trustllm_pkg/pyproject.toml').read_text())['project']
          version = project['version']
          if project['name'] != 'trustllm' or os.environ['RELEASE_TAG'] != f'v{version}':
              raise SystemExit('Release tag must be v<version> matching trustllm package metadata')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              print(f'version={version}', file=output)
          PY
      - name: Install build and test dependencies
        run: python -m pip install './trustllm_pkg[dev]'
      - name: Run offline checks
        run: |
          python -m ruff check .
          python -m pytest
      - name: Build sdist and wheel from that sdist
        run: python -m build trustllm_pkg --outdir dist
      - name: Check package metadata
        run: python -m twine check --strict dist/*
      - name: Install the wheel outside the checkout
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          python -m venv "$RUNNER_TEMP/wheel-check"
          "$RUNNER_TEMP/wheel-check/bin/python" -m pip install dist/*.whl
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/wheel-check/bin/python" - <<'PY'
          import importlib.metadata
          import os
          import sys
          import trustllm
          from importlib.resources import files

          assert importlib.metadata.version('trustllm') == os.environ['RELEASE_VERSION']
          assert 'torch' not in sys.modules
          assert any(files('trustllm').joinpath('prompt').iterdir())
          PY
          "$RUNNER_TEMP/wheel-check/bin/trustllm" tasks
          "$RUNNER_TEMP/wheel-check/bin/python" -m trustllm generate --help
      - uses: actions/upload-artifact@v4
        with:
          name: python-distributions
          path: dist/*
          if-no-files-found: error

  publish:
    needs: build
    if: github.event_name == 'release' || inputs.publish
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/trustllm/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: python-distributions
          path: dist
      - name: Publish to PyPI with Trusted Publishing
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2

  verify:
    needs: [build, publish]
    runs-on: ubuntu-latest
    env:
      RELEASE_VERSION: ${{ needs.build.outputs.version }}
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify installation from PyPI
        run: |
          python -m pip install --no-cache-dir --index-url https://pypi.org/simple "trustllm==$RELEASE_VERSION"
          python - <<'PY'
          import importlib.metadata
          import os
          import sys
          import trustllm

          assert importlib.metadata.version('trustllm') == os.environ['RELEASE_VERSION']
          assert 'torch' not in sys.modules
          PY
          trustllm tasks
          python -m trustllm generate --help
