name: Publish documentation

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['docs/**', 'mkdocs.yml', '.github/workflows/mkdocs-publish-ghpages.yml']

permissions:
  contents: write

concurrency:
  group: documentation-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e './trustllm_pkg[docs]'
      - run: python -m mkdocs gh-deploy --strict --force
